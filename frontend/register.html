<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forexia - Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <div class="auth-container">

        <div class="auth-card">

            <!-- =========================
                 FOREXIA LOGO
            ========================== -->

            <div class="login-logo">

                <img
                    src="images/forexia-logo.png"
                    alt="Forexia"
                >

            </div>


            <!-- =========================
                 REGISTER CONTENT
            ========================== -->

            <div class="login-content">

                <p class="login-subtitle">
                    Create your account
                </p>


                <h2>
                    Register
                </h2>


                <!-- =========================
                     REGISTER FORM
                ========================== -->

                <form id="registerForm">

                    <input
                        type="text"
                        id="name"
                        placeholder="Full Name"
                        required
                    >


                    <input
                        type="email"
                        id="email"
                        placeholder="Email"
                        required
                    >


                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required
                    >


                    <button type="submit">
                        Create Account
                    </button>

                </form>


                <!-- =========================
                     MESSAGE
                ========================== -->

                <p id="message"></p>


                <!-- =========================
                     LOGIN LINK
                ========================== -->

                <p class="switch">

                    Already have an account?

                    <a href="index.html">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/auth.js"></script>

</body>

</html>
