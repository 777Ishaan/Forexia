<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Forexia - My Profile</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <nav class="navbar">

        <div class="logo">
            <img src="images/forexia-logo.png" alt="Forexia">
        </div>

        <button class="nav-toggle-btn" onclick="const n=document.getElementById('navRight'); if(n) n.classList.toggle('mobile-open');" aria-label="Toggle navigation">
            <i class="fas fa-bars"></i>
        </button>

        <div class="nav-right" id="navRight">

            <span id="userEmail"></span>

            <button onclick="window.location.href='dashboard.html'">
                <i class="fas fa-chart-line"></i>
                Dashboard
            </button>

            <button onclick="window.location.href='wallet.html'">
                <i class="fas fa-wallet"></i>
                Wallet
            </button>

            <button onclick="window.location.href='transactions.html'">
                <i class="fas fa-list"></i>
                Transactions
            </button>

            <button onclick="window.location.href='profile.html'" class="active-nav">
                <i class="fas fa-user"></i>
                Profile
            </button>

            <button onclick="logout()">
                <i class="fas fa-sign-out-alt"></i>
                Logout
            </button>

        </div>

    </nav>


    <!-- =========================
         PROFILE
    ========================== -->

    <main class="dashboard">

        <h1>
            My Profile
        </h1>

        <p class="welcome">
            Manage your Forexia account information
        </p>


        <section class="profile-section">

            <!-- =========================
                 PROFILE HEADER
            ========================== -->

            <div class="profile-header">

                <div class="profile-avatar">

                    <span>
                        👤
                    </span>

                </div>

                <div>

                    <h2 id="profileName">
                        Ishaan Sharma
                    </h2>

                    <p id="profileEmail">
                        test@example.com
                    </p>

                </div>

            </div>


            <!-- =========================
                 ACCOUNT INFORMATION
            ========================== -->

            <div class="profile-info">

                <div class="profile-item">

                    <span class="profile-label">
                        Name
                    </span>

                    <strong id="profileNameInfo">
                        Ishaan Sharma
                    </strong>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        Email
                    </span>

                    <strong id="profileEmailInfo">
                        test@example.com
                    </strong>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        Account created
                    </span>

                    <strong id="profileCreated">
                        13 August 2026
                    </strong>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        Phone
                    </span>

                    <strong id="profilePhone">
                        Not provided
                    </strong>

                </div>


                <div class="profile-item">

                    <span class="profile-label">
                        Default currency
                    </span>

                    <strong id="profileCurrency">
                        INR
                    </strong>

                </div>

            </div>


            <!-- =========================
                 ACTIONS
            ========================== -->

            <div class="profile-actions">

                <button
                    type="button"
                    onclick="changePassword()"
                >
                    Change Password
                </button>


                <button
                    type="button"
                    onclick="updateProfile()"
                    class="profile-update-button"
                >
                    Update Profile
                </button>

            </div>


            <p
                id="profileMessage"
                class="profile-message"
            ></p>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="js/api.js"></script>

    <script src="js/profile.js"></script>

</body>

</html>
